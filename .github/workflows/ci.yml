name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: judge path (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Exactly what a judge is asked to run, including the dashboard extra.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,dashboard]'

      - name: unittest
        run: python -m unittest discover -s tests -v

      - name: pytest
        run: python -m pytest -q

      # make ci already runs the adversarial board, the benchmark smoke sweep,
      # the dashboard import check, and the truth/AI regression suites.
      - name: make ci
        run: make ci

      - name: make demo
        run: make demo

      - name: make judge
        run: make judge

      - name: Upload judging artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milaan-artifacts-py${{ matrix.python-version }}
          path: |
            data/judge/functional_metrics.json
            data/judge/agent_metrics.json
            data/judge/artifact_provenance.json
            data/judge/runtime_telemetry.json
            data/judge/report.html
            data/benchmark_smoke.json
          if-no-files-found: warn

  # The full Track-04 throughput claim is proven on the exact commit being
  # submitted. The benchmark file itself records git SHA, environment, all
  # fifteen raw repetitions and every correctness gate; this job additionally
  # binds that embedded SHA to GitHub's immutable GITHUB_SHA before upload.
  full-benchmark:
    name: exact-SHA full benchmark
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run complete 5-size x 3-repetition benchmark
        run: make benchmark
      - name: Verify benchmark provenance and safety gates
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/benchmark.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          expected_sha = os.environ["EXPECTED_SHA"]
          actual_sha = data["environment"]["git_sha"]
          assert actual_sha == expected_sha, (actual_sha, expected_sha)

          runs = data["raw_runs"]
          assert len(runs) == 15, len(runs)
          assert {row["requested_orders"] for row in runs} == {50, 200, 1200, 5000, 10000}
          assert all(row["gate"]["status"] == "PASS" for row in runs)
          assert all(row["truth_integrity"] == "PASS" for row in runs)
          assert all(row["false_match_count"] == 0 for row in runs)
          assert all(row["source_conservation"] == 1.0 for row in runs)
          assert all(row["amount_delta_paise"] == 0 for row in runs)
          assert all(result["repetitions"] == 3 for result in data["results"])
          assert all(result["all_gates_passed"] for result in data["results"])
          assert all(result["total_false_matches"] == 0 for result in data["results"])

          print(f"exact-SHA benchmark VERIFIED for {actual_sha}: {len(runs)} raw runs")
          PY
      - name: Upload exact-SHA full benchmark
        uses: actions/upload-artifact@v4
        with:
          name: milaan-full-benchmark-${{ github.sha }}
          path: data/benchmark.json
          if-no-files-found: error

  no-api-key-required:
    name: offline guarantee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,dashboard]'
      # Deliberately no secrets in this job's environment.
      - name: judge mode runs with no provider configuration at all
        env:
          MILAAN_LLM_PROVIDER: ""
          MILAAN_LLM_MODEL: ""
          MILAAN_LLM_API_KEY: ""
        run: make judge

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
