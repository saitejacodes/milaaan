[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "milaan"
version = "1.3.0"
description = "Fail-closed settlement reconciliation with bounded AI investigation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Milaan"}]
dependencies = []

[project.optional-dependencies]
llm = ["httpx==0.28.1"]
dashboard = ["streamlit==1.49.1"]
preview = ["pillow==12.3.0"]
dev = ["httpx==0.28.1", "pytest==8.4.2", "pytest-cov==6.2.1"]

[project.scripts]
milaan = "milaan.cli:main"

[tool.setuptools.packages.find]
include = ["milaan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
