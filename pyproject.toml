[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milaan"
version = "1.2.2"
description = "Deterministic three-way settlement reconciliation with an LLM explanation layer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Milaan"}]
dependencies = ["typer>=0.12", "jinja2>=3.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
milaan = "milaan.cli:main"

[tool.setuptools.packages.find]
include = ["milaan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
